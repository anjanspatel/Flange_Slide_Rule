<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem('pd-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}}());</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — ANJAN PATEL</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1D2D">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --brand-navy:#0B1D2D;--brand-orange:#F28C18;
  --bg:#EFF3FA;--surface:#FFFFFF;--text:#0B1D2D;--muted:#5E728A;
  --line:#D3DCE9;--header-bg:rgba(255,255,255,.92);
  --logo-border:rgba(11,29,45,.10);--logo-shadow:0 1px 4px rgba(11,29,45,.10),0 2px 8px rgba(11,29,45,.06);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#04080F;--surface:#091522;--text:#EDF2F8;--muted:#7A96B0;
  --line:#122030;--header-bg:rgba(6,16,28,.90);
  --logo-border:rgba(242,140,24,.18);--logo-shadow:0 0 0 1px rgba(242,140,24,.08),0 4px 14px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#04080F;--surface:#091522;--text:#EDF2F8;--muted:#7A96B0;
  --line:#122030;--header-bg:rgba(6,16,28,.90);
  --logo-border:rgba(242,140,24,.18);--logo-shadow:0 0 0 1px rgba(242,140,24,.08),0 4px 14px rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;display:flex;flex-direction:column}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',Arial,sans-serif;-webkit-font-smoothing:antialiased;transition:background .22s,color .22s}
.site-header{background:var(--header-bg);border-bottom:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.header-inner{max-width:1100px;margin:0 auto;padding:0 28px;height:64px;display:flex;align-items:center}
.brand{display:flex;align-items:center;gap:13px;text-decoration:none;color:inherit}
.logo-wrap{width:42px;height:42px;border-radius:10px;background:#fff;border:1px solid var(--logo-border);box-shadow:var(--logo-shadow);display:grid;place-items:center;overflow:hidden;flex:0 0 auto}
.logo-img{width:37px;height:34px;display:block;object-fit:contain}
.brand-name{font-size:12.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--text)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center}
.err-code{font-family:'IBM Plex Mono',monospace;font-size:88px;font-weight:700;color:var(--brand-orange);letter-spacing:-.04em;line-height:1;margin-bottom:4px;opacity:.9}
.err-title{font-size:22px;font-weight:700;color:var(--text);margin-bottom:12px}
.err-sub{font-size:14px;color:var(--muted);line-height:1.65;max-width:380px;margin-bottom:32px}
.btn-home{display:inline-flex;align-items:center;gap:8px;background:var(--brand-orange);color:#fff;text-decoration:none;font-size:13px;font-weight:600;padding:11px 24px;border-radius:9px;letter-spacing:.02em;transition:opacity .15s}
.btn-home:hover{opacity:.88}
.btn-home svg{stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
footer{border-top:1px solid var(--line);padding:18px 28px;text-align:center;font-size:11px;color:var(--muted)}
footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:var(--text)}
@media(max-width:600px){.header-inner{padding:0 18px;height:58px}.err-code{font-size:64px}}
</style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="/" aria-label="Anjan Patel Engineering Tools — home">
      <span class="logo-wrap">
        <img class="logo-img" src="/logo.png" alt="Anjan Patel monogram">
      </span>
      <span class="brand-name">ANJAN PATEL</span>
    </a>
  </div>
</header>
<main>
  <div class="err-code">404</div>
  <h1 class="err-title">Page Not Found</h1>
  <p class="err-sub">The page you&#8217;re looking for doesn&#8217;t exist or has been moved. Head back to the tools hub.</p>
  <a class="btn-home" href="/">
    <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><line x1="12" y1="7" x2="2" y2="7"/><polyline points="7,12 2,7 7,2"/></svg>
    Back to Tools
  </a>
</main>
<footer>
  <span>&copy; <span id="yr"></span> Anjan Patel</span>
  &nbsp;&middot;&nbsp;
  <a href="/terms/">Terms &amp; Disclaimer</a>
</footer>
<script>document.getElementById('yr').textContent=new Date().getFullYear();</script>
</body>
</html>
