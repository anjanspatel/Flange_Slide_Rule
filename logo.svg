<svg viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="Anjan Patel monogram">
  <!-- A: left diagonal stroke (navy) -->
  <polygon points="6,83 23,83 47,7 34,7" fill="#1A2F55"/>
  <!-- P: vertical stem (slate gray) -->
  <polygon points="47,7 61,7 61,83 47,83" fill="#555B68"/>
  <!-- P: top horizontal bar -->
  <polygon points="47,7 96,7 96,27 47,27" fill="#555B68"/>
  <!-- P: right side bowl with angled bottom-right corner -->
  <polygon points="82,27 96,27 94,53 82,53" fill="#555B68"/>
  <!-- P: crossbar -->
  <polygon points="47,43 96,43 94,53 47,53" fill="#555B68"/>
  <!-- Orange triangle (between A legs) -->
  <polygon points="26,83 47,83 36,62" fill="#E07C14"/>
</svg>